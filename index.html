<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Journey</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER BANNER -->
  <header class="banner">
    <h1>Your Journey</h1>
    <p>24 weeks, 16 steps. Every step builds something you can show.</p>
    <p class="progress-count" id="progress-count"></p>
    <!-- Decorative road to the finish flag -->
    <svg class="banner-road" viewBox="0 0 320 64" aria-hidden="true" focusable="false">
      <path d="M8 50 C70 6 112 62 172 32 S268 8 296 38" fill="none" stroke="rgba(255,255,255,0.55)"
            stroke-width="3" stroke-linecap="round" stroke-dasharray="1 9"/>
      <circle cx="8" cy="50" r="5" fill="#FFFFFF"/>
      <line x1="296" y1="38" x2="296" y2="12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M296 12 L316 19 L296 26 Z" fill="#C9A227"/>
    </svg>
  </header>

  <main class="container">
    <!-- The render function (script.js) fills this list from the data. -->
    <!-- Encouragement line, filled in by script.js (hidden when empty) -->
    <p class="milestone" id="milestone" role="status" hidden></p>

    <div class="toolbar">
      <button type="button" class="toolbar-button" id="expand-all">Expand all</button>
    </div>

    <ol class="timeline" id="timeline"></ol>

    <!-- Finish line: dim at first, lights up as the student gets closer (data-level set by script.js) -->
    <div class="finish-line" id="finish-line" data-level="0">
      <svg viewBox="0 0 64 72" aria-hidden="true" focusable="false">
        <path d="M16 6 H48 V26 C48 36 41 42 32 42 C23 42 16 36 16 26 Z" fill="#C9A227"/>
        <path d="M16 12 H6 C6 24 10 30 18 32" fill="none" stroke="#C9A227" stroke-width="4" stroke-linecap="round"/>
        <path d="M48 12 H58 C58 24 54 30 46 32" fill="none" stroke="#C9A227" stroke-width="4" stroke-linecap="round"/>
        <rect x="28" y="42" width="8" height="12" fill="#C9A227"/>
        <rect x="18" y="54" width="28" height="8" rx="2" fill="#0B2545"/>
      </svg>
      <p>The finish line</p>
    </div>
    <p class="roles-note" id="roles-note"></p>

    <div class="step-picker">
      <label for="step-picker">Set the current step</label>
      <select id="step-picker"></select>
      <p class="step-picker-hint">Your choice is saved in this page's link, so you can copy and share it.</p>
    </div>
  </main>

  <!-- Floating shortcut back to the current step -->
  <button type="button" class="jump-button" id="jump-to-current">Jump to &ldquo;You are here&rdquo;</button>

  <!-- Order matters: data first, then the code that uses it. -->
  <script src="journey-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
